{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<style>
    #modulo_modificar_notas_academicas {
        width: 100%;
        padding: 35px 20px;
        box-sizing: border-box;
        font-family: "Montserrat", sans-serif;
    }

    .contenedor_modificar_notas_academicas {
        width: min(1250px, 100%);
        margin: 0 auto;
        background: #ffffff;
        border-radius: 14px;
        padding: 30px;
        box-sizing: border-box;
        box-shadow: 0 8px 30px rgba(16, 47, 78, 0.10);
        border: 1px solid #e5ebf0;
    }

    .contenedor_modificar_notas_academicas h2 {
        margin: 0 0 28px;
        padding-bottom: 18px;
        color: #102f4e;
        font-size: 25px;
        font-weight: 700;
        border-bottom: 2px solid #e7edf2;
        position: relative;
    }

    .contenedor_modificar_notas_academicas h2::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -2px;
        width: 65px;
        height: 3px;
        background: #00779e;
        border-radius: 3px;
    }

    .modificar_notas_academicas {
        width: 100%;
    }

    #formulario_actualizar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 24px;
    }

    #formulario_actualizar label {
        display: block;
        margin-bottom: 8px;
        color: #102f4e;
        font-size: 14px;
        font-weight: 600;
    }

    #formulario_actualizar select,
    #formulario_actualizar input[type="text"] {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        box-sizing: border-box;
        border: 1px solid #cbd6df;
        border-radius: 8px;
        background: #ffffff;
        color: #263746;
        font-family: "Montserrat", sans-serif;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    #formulario_actualizar select {
        cursor: pointer;
    }

    #formulario_actualizar select:focus,
    #formulario_actualizar input[type="text"]:focus {
        border-color: #00779e;
        box-shadow: 0 0 0 3px rgba(0, 119, 158, 0.10);
    }

    #formulario_actualizar input[readonly] {
        background: #f3f6f8;
        color: #536574;
        cursor: default;
    }

    .contenedor_boton_notas {
        grid-column: 1 / -1;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-top: 5px;
        padding-top: 8px;
    }

    #btn_registrar_notas {
        min-width: 170px;
        height: 44px;
        padding: 0 24px;
        border: none;
        border-radius: 8px;
        background: #00779e;
        color: #ffffff;
        font-family: "Montserrat", sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    #btn_registrar_notas:hover {
        background: #005f7e;
        box-shadow: 0 5px 14px rgba(0, 119, 158, 0.20);
        transform: translateY(-1px);
    }

    #btn_registrar_notas:active {
        transform: translateY(0);
    }

    #btn_registrar_notas:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
    }

    #contenedor_notas_academicas {
        grid-column: 1 / -1;
        width: 100%;
        margin-top: 8px;
        overflow-x: auto;
        border-radius: 10px;
    }

    #contenedor_notas_academicas:empty {
        display: none;
    }

    #contenedor_notas_academicas>p {
        margin: 0;
        padding: 18px;
        border: 1px solid #e1e8ed;
        border-radius: 8px;
        background: #f7f9fa;
        color: #60717f;
        font-size: 14px;
        text-align: center;
    }

    #contenedor_notas_academicas table {
        width: 100%;
        min-width: 850px;
        border-collapse: collapse;
        background: #ffffff;
        border: 1px solid #dce5eb;
        border-radius: 10px;
        overflow: hidden;
    }

    #contenedor_notas_academicas thead {
        background: #102f4e;
    }

    #contenedor_notas_academicas th {
        padding: 13px 12px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        white-space: nowrap;
    }

    #contenedor_notas_academicas td {
        padding: 10px 12px;
        border-bottom: 1px solid #e8edf1;
        color: #344654;
        font-size: 13px;
        text-align: center;
    }

    #contenedor_notas_academicas tbody tr:last-child td {
        border-bottom: none;
    }

    #contenedor_notas_academicas tbody tr:hover {
        background: #f6fafc;
    }

    #contenedor_notas_academicas .input-calificacion,
    #contenedor_notas_academicas .input-asistencia,
    #contenedor_notas_academicas .input-promedio {
        width: 75px;
        height: 36px;
        padding: 0 8px;
        box-sizing: border-box;
        border: 1px solid #ccd8e0;
        border-radius: 6px;
        background: #ffffff;
        color: #263746;
        font-family: "Montserrat", sans-serif;
        font-size: 13px;
        text-align: center;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #contenedor_notas_academicas .input-calificacion:focus,
    #contenedor_notas_academicas .input-asistencia:focus {
        border-color: #00779e;
        box-shadow: 0 0 0 3px rgba(0, 119, 158, 0.10);
    }

    #contenedor_notas_academicas .input-promedio {
        background: #f0f5f8;
        color: #102f4e;
        font-weight: 700;
        border-color: #d5e0e7;
        cursor: default;
    }

    #contenedor_notas_academicas .celda-promedio {
        background: #f8fafb;
    }

    #contenedor_notas_academicas .celda-asistencia {
        min-width: 100px;
    }

    #contenedor_notas_academicas .celda-calificacion {
        min-width: 95px;
    }

    /* Scroll de la tabla */
    #contenedor_notas_academicas::-webkit-scrollbar {
        height: 7px;
    }

    #contenedor_notas_academicas::-webkit-scrollbar-track {
        background: #edf1f4;
        border-radius: 10px;
    }

    #contenedor_notas_academicas::-webkit-scrollbar-thumb {
        background: #aebdc8;
        border-radius: 10px;
    }

    #contenedor_notas_academicas::-webkit-scrollbar-thumb:hover {
        background: #8799a6;
    }

    @media (max-width: 850px) {
        #modulo_modificar_notas_academicas {
            padding: 20px 12px;
        }

        .contenedor_modificar_notas_academicas {
            padding: 22px 18px;
        }

        #formulario_actualizar {
            grid-template-columns: 1fr;
            gap: 17px;
        }

        .contenedor_boton_notas {
            grid-column: auto;
            justify-content: stretch;
        }

        #btn_registrar_notas {
            width: 100%;
        }

        #contenedor_notas_academicas {
            grid-column: auto;
        }
    }

    @media (max-width: 500px) {
        #modulo_modificar_notas_academicas {
            padding: 12px 8px;
        }

        .contenedor_modificar_notas_academicas {
            padding: 18px 14px;
            border-radius: 10px;
        }

        .contenedor_modificar_notas_academicas h2 {
            font-size: 21px;
        }

        #formulario_actualizar select,
        #formulario_actualizar input[type="text"] {
            height: 42px;
        }
    }
</style>

<section id="modulo_modificar_notas_academicas">
    <div class="contenedor_modificar_notas_academicas">
        <h2>Modificar Notas Académicas</h2>

        <div class="modificar_notas_academicas">
            <form method="post" id="formulario_actualizar">
                {% csrf_token %}
                <label for="nucleo_asignado">Núcleo Asignado:</label>
                <select name="nucleo_asignado" id="nucleo_asignado"></select>

                <label for="pnf_asignado">P.N.F Asignado:</label>
                <select name="pnf_asignado" id="pnf_asignado"></select>

                <label for="materia_asignada">Materia(s) Asignada(s):</label>
                <select name="materia_asignada" id="materia_asignada"></select>

                <label for="periodo_academico">Periodo Académico:</label>
                <input type="text" name="periodo_academico" id="periodo_academico" readonly>

                <label for="trayecto_academico">Trayecto Académico:</label>
                <input type="text" name="trayecto_academico" id="trayecto_academico" readonly>

                <div class="contenedor_boton_notas">
                    <input type="submit" value="Registrar" id="btn_registrar_notas">
                </div>

                <div id="contenedor_notas_academicas"></div>
            </form>
        </div>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Docente/modificar_notas_academicas.js' %}"></script>

{% endblock %}
