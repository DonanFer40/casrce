{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<style>
    /* ==========================================
   MÓDULO VISUALIZAR REPARACIÓN
   ========================================== */

    #modulo_visualizar_reparacion {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
        background-color: #f8fafc;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .contenedor_visualizar_reparacion {
        width: 100%;
        max-width: 900px;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        padding: 2.5rem;
        border: 1px solid #e2e8f0;
    }

    .contenedor_visualizar_reparacion h2 {
        color: #0f172a;
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 2rem;
        text-align: center;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 0.75rem;
    }

    /* Grilla del formulario */
    .contenedor_visualizar_reparacion form {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
    }

    .grupo_campo {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .grupo_campo label {
        font-size: 0.875rem;
        font-weight: 600;
        color: #334155;
    }

    .grupo_campo select,
    .grupo_campo input[type="text"] {
        width: 100%;
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
        color: #1e293b;
        background-color: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        transition: all 0.2s ease-in-out;
    }

    .grupo_campo select:focus {
        border-color: #2563eb;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .grupo_campo input[readonly] {
        background-color: #f1f5f9;
        color: #64748b;
        cursor: not-allowed;
        border-color: #e2e8f0;
    }

    /* Botón de acción */
    .contenedor_boton_notas {
        grid-column: 1 / -1;
        display: flex;
        justify-content: flex-end;
        margin-top: 0.5rem;
    }

    /* Sección donde se inyecta la tabla o mensajes */
    #contenedor_evaluaciones {
        grid-column: 1 / -1;
        margin-top: 1.5rem;
    }

    /* ==========================================
   MÓDULO VISUALIZAR REPARACIÓN - ESTILOS BASE
   ========================================== */

    #modulo_visualizar_reparacion {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
        background-color: #f8fafc;

        padding: 2.5rem;
        border: 1px solid #e2e8f0;
    }

    .contenedor_visualizar_reparacion h2 {
        color: #0f172a;

        font-weight: 700;
        margin-bottom: 2rem;
        text-align: center;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 0.75rem;
    }

    /* Grilla del formulario */
    .contenedor_visualizar_reparacion form {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
    }

    }

    .grupo_campo label {

    }

    .grupo_campo select,
    .grupo_campo input[type="text"] {
        width: 100%;

        transition: all 0.2s ease-in-out;
    }

    .grupo_campo select:focus {
        border-color: #2563eb;

    .grupo_campo input[readonly] {

    }

    /* Botón de acción */
    .contenedor_boton_notas {
        grid-column: 1 / -1;
        display: flex;
        justify-content: flex-end;
        margin-top: 0.5rem;
    }

    /* Sección donde se inyecta la tabla o mensajes */
    #contenedor_evaluaciones {
        grid-column: 1 / -1;
        margin-top: 1.5rem;
    }

    /* ==========================================
   ESTILOS DE LA TABLA Y SUS CONTROLES DINÁMICOS
   ========================================== */

    #contenedor_evaluaciones .table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        background-color: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #e2e8f0;
    }

    #contenedor_evaluaciones .table thead.table-dark {
        background-color: #0f172a !important;
    }

    #contenedor_evaluaciones .table th {
        padding: 0.85rem 1rem;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #f8fafc;
        border-bottom: none;
    }

    #contenedor_evaluaciones .table td {
        padding: 0.85rem 1rem;
        font-size: 0.9rem;
        color: #334155;
        border-bottom: 1px solid #f1f5f9;
    }

    #contenedor_evaluaciones .table tbody tr:hover {
        background-color: #f8fafc;
    }

    #contenedor_evaluaciones .table tbody tr:last-child td {
        border-bottom: none;
    }

    /* Insignias de estado (Badges) */
    #contenedor_evaluaciones .badge {
        font-size: 0.78rem;
        padding: 0.35em 0.75em;
        font-weight: 600;
        border-radius: 6px;
        letter-spacing: 0.02em;
    }

    #contenedor_evaluaciones .badge.bg-success {
        background-color: #dcfce7 !important;
        color: #15803d !important;
    }

    #contenedor_evaluaciones .badge.bg-danger {
        background-color: #fee2e2 !important;
        color: #b91c1c !important;
    }

    /* Responsividad */
    @media (max-width: 640px) {
        .contenedor_visualizar_reparacion form {
            grid-template-columns: 1fr;
        }

        .contenedor_visualizar_reparacion {
            padding: 1.5rem;
        }
    }

    /* Responsividad */
    @media (max-width: 640px) {
        .contenedor_visualizar_reparacion form {
            grid-template-columns: 1fr;
        }

        .contenedor_visualizar_reparacion {
            padding: 1.5rem;
        }
    }
</style>

<section id="modulo_visualizar_reparacion">
    <div class="contenedor_visualizar_reparacion">
        <h2>Visualizar Reparación</h2>

        <form method="post">
            {% csrf_token %}

            <div class="grupo_campo">
                <label for="nucleo_asignado">Núcleo Asignado:</label>
                <select name="nucleo_asignado" id="nucleo_asignado"></select>
            </div>

            <div class="grupo_campo">
                <label for="pnf_asignado">P.N.F Asignado:</label>
                <select name="pnf_asignado" id="pnf_asignado"></select>
            </div>

            <div class="grupo_campo">
                <label for="materia_asignada">Materia(s) Reparadas:</label>
                <select name="materia_asignada" id="materia_asignada"></select>
            </div>

            <div class="grupo_campo">
                <label for="fecha_registradas">Fecha Registradas:</label>
                <select name="fecha" id="fecha_registradas"></select>
            </div>

            <div class="grupo_campo">
                <label for="trayecto_academico">Trayecto:</label>
                <input type="text" name="trayecto_academico" id="trayecto_academico" readonly
                    placeholder="Cargando trayecto...">
            </div>

            <div id="contenedor_evaluaciones"></div>
        </form>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Docente/visualizar_reparaciones.js' %}"></script>

{% endblock %}
