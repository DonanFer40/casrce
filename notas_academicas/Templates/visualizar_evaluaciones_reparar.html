{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<style>
    /* Estilos del Módulo Principal */
    #modulo_visualizar_evaluaciones {
        padding: 2rem;
        background-color: #f8f9fa;
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .contenedor_visualizar_evaluaciones {
        max-width: 1100px;
        margin: 0 auto;
        background: #ffffff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .contenedor_visualizar_evaluaciones h2 {
        color: #2c3e50;
        margin-bottom: 1.5rem;
        font-size: 1.5rem;
        font-weight: 600;
        border-bottom: 2px solid #e9ecef;
        padding-bottom: 0.75rem;
    }

    /* Estilos de la Tabla */
    .contenedor_visualizar_evaluaciones table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 1rem;
        overflow: hidden;
        border-radius: 8px;
        border: 1px solid #e9ecef;
    }

    /* Encabezado de la Tabla */
    .contenedor_visualizar_evaluaciones thead th {
        background-color: #34495e;
        color: #ffffff;
        padding: 12px 16px;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: left;
    }

    /* Celdas de Datos (td) */
    .contenedor_visualizar_evaluaciones tbody td {
        padding: 14px 16px;
        color: #495057;
        font-size: 0.95rem;
        border-bottom: 1px solid #e9ecef;
        transition: background-color 0.2s ease;
    }

    /* Filas Intercaladas (Zebrada) */
    .contenedor_visualizar_evaluaciones tbody tr:nth-child(even) {
        background-color: #f8f9fa;
    }

    /* Efecto Hover en las Filas */
    .contenedor_visualizar_evaluaciones tbody tr:hover td {
        background-color: #e9ecef;
    }

    /* Eliminar borde inferior de la última fila */
    .contenedor_visualizar_evaluaciones tbody tr:last-child td {
        border-bottom: none;
    }

    /* Alineación opcional para columnas específicas */
    .contenedor_visualizar_evaluaciones tbody td:first-child {
        font-weight: bold;
        color: #2c3e50;
        width: 60px;
        /* Columna ID */
    }

    /* Adaptabilidad para pantallas pequeñas */
    @media (max-width: 768px) {
        .contenedor_visualizar_evaluaciones {
            padding: 1rem;
            overflow-x: auto;
        }

        .contenedor_visualizar_evaluaciones table {
            min-width: 650px;
            /* Permite scroll horizontal si la pantalla es muy angosta */
        }
    }
</style>

<section id="modulo_visualizar_evaluaciones">
    <div class="contenedor_visualizar_evaluaciones">
        <h2>Visualizar Evaluaciones Reparación</h2>

        <table>
            <thead>
                <th>ID</th>
                <th>P.N.F</th>
                <th>MATERIA</th>
                <th>FECHA</th>
                <th>EVALUACION 1</th>
                <th>EVALUACION 2</th>
                <th>EVALUACION 3</th>
            </thead>
            <tbody id="contenedor_evaluaciones"></tbody>
        </table>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Docente/visualizar_evaluaciones_reparacion.js' %}"></script>

{% endblock %}
