{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<style>
    /* =========================================================
   VISUALIZAR NOTAS ACADÉMICAS
   ========================================================= */

    #modulo_visualizar_notas_academicas {
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
    }

    .contenedor_visualizar_notas_academicas {
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
    }

    .contenedor_visualizar_notas_academicas h2 {
        margin: 0 0 24px;
        font-size: 26px;
        font-weight: 700;
        color: #102f4e;
        letter-spacing: 0.2px;
    }


    /* =========================================================
   CONTENEDOR DE BÚSQUEDA
   ========================================================= */

    .busqueda_notas_academicas {
        width: 100%;
        padding: 24px;
        margin-bottom: 28px;
        background: #ffffff;
        border: 1px solid #dce5eb;
        border-radius: 12px;
        box-sizing: border-box;
        box-shadow: 0 3px 12px rgba(16, 47, 78, 0.07);
    }

    #formulario_busqueda {
        display: grid;
        grid-template-columns: repeat(2, minmax(250px, 1fr));
        gap: 20px 24px;
        align-items: end;
    }


    /* =========================================================
   LABELS
   ========================================================= */

    #formulario_busqueda label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
        color: #263b4a;
    }


    /* =========================================================
   CAMPOS
   ========================================================= */

    #formulario_busqueda select,
    #formulario_busqueda input[type="text"] {
        width: 100%;
        height: 44px;
        padding: 0 13px;
        border: 1px solid #cbd7df;
        border-radius: 7px;
        outline: none;
        background: #ffffff;
        color: #243746;
        font-family: inherit;
        font-size: 14px;
        box-sizing: border-box;
        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background-color 0.2s ease;
    }

    #formulario_busqueda select {
        cursor: pointer;
    }

    #formulario_busqueda select:hover,
    #formulario_busqueda input[type="text"]:hover {
        border-color: #9eb4c2;
    }

    #formulario_busqueda select:focus,
    #formulario_busqueda input[type="text"]:focus {
        border-color: #00779e;
        box-shadow: 0 0 0 3px rgba(0, 119, 158, 0.12);
    }


    /* =========================================================
   CAMPOS DE SOLO LECTURA
   ========================================================= */

    #formulario_busqueda input[readonly] {
        background: #f3f6f8;
        color: #536673;
        cursor: default;
    }


    /* =========================================================
   CONTENEDOR DOCENTE
   ========================================================= */

    #contenedor_seleccion_docente {
        width: 100%;
    }


    /* =========================================================
   RESULTADOS
   ========================================================= */

    #contenedor_notas_academicas {
        width: 100%;
        overflow-x: auto;
        box-sizing: border-box;
        padding-bottom: 8px;
    }


    /* =========================================================
   TABLA DE CALIFICACIONES
   ========================================================= */

    .tabla-calificaciones {
        width: 100%;
        min-width: 900px;
        border-collapse: separate;
        border-spacing: 0;
        background: #ffffff;
        border: 1px solid #d8e2e8;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 3px 12px rgba(16, 47, 78, 0.07);
        font-size: 14px;
    }


    /* =========================================================
   ENCABEZADO
   ========================================================= */

    .tabla-calificaciones thead {
        background: #102f4e;
    }

    .tabla-calificaciones thead th {
        height: 48px;
        padding: 10px 14px;
        border-right: 1px solid rgba(255, 255, 255, 0.12);
        border-bottom: 1px solid #102f4e;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        white-space: nowrap;
        vertical-align: middle;
    }

    .tabla-calificaciones thead th:last-child {
        border-right: none;
    }


    /* =========================================================
   CUERPO
   ========================================================= */

    .tabla-calificaciones tbody tr {
        background: #ffffff;
        transition: background-color 0.15s ease;
    }

    .tabla-calificaciones tbody tr:nth-child(even) {
        background: #f8fafb;
    }

    .tabla-calificaciones tbody tr:hover {
        background: #eef5f8;
    }

    .tabla-calificaciones tbody td {
        height: 46px;
        padding: 9px 14px;
        border-right: 1px solid #e1e8ed;
        border-bottom: 1px solid #e1e8ed;
        color: #263b4a;
        text-align: center;
        vertical-align: middle;
        white-space: nowrap;
    }

    .tabla-calificaciones tbody tr:last-child td {
        border-bottom: none;
    }

    .tabla-calificaciones tbody td:last-child {
        border-right: none;
    }


    /* =========================================================
   COLUMNAS ESPECÍFICAS
   ========================================================= */

    .tabla-calificaciones th:first-child,
    .tabla-calificaciones td:first-child {
        width: 55px;
        min-width: 55px;
        text-align: center;
    }

    .tabla-calificaciones th:nth-child(2),
    .tabla-calificaciones td:nth-child(2) {
        min-width: 230px;
        text-align: left;
    }

    .tabla-calificaciones th:nth-child(3),
    .tabla-calificaciones td:nth-child(3) {
        min-width: 110px;
    }

    .tabla-calificaciones th:nth-last-child(2),
    .tabla-calificaciones td:nth-last-child(2) {
        min-width: 110px;
    }

    .tabla-calificaciones th:last-child,
    .tabla-calificaciones td:last-child {
        min-width: 100px;
    }


    /* =========================================================
   CELDAS DE CALIFICACIÓN
   ========================================================= */

    .tabla-calificaciones .celda-calificacion {
        min-width: 85px;
        font-weight: 600;
        color: #102f4e;
    }


    /* =========================================================
   ASISTENCIA
   ========================================================= */

    .tabla-calificaciones .celda-asistencia {
        min-width: 105px;
        font-weight: 600;
        color: #00779e;
    }


    /* =========================================================
   PROMEDIO
   ========================================================= */

    .tabla-calificaciones .celda-promedio {
        min-width: 100px;
        font-size: 15px;
        font-weight: 700;
        color: #102f4e;
    }


    /* =========================================================
   PRIMERA COLUMNA
   ========================================================= */

    .tabla-calificaciones tbody td:first-child {
        font-weight: 600;
        color: #667985;
    }


    /* =========================================================
   SCROLL HORIZONTAL
   ========================================================= */

    #contenedor_notas_academicas::-webkit-scrollbar {
        height: 9px;
    }

    #contenedor_notas_academicas::-webkit-scrollbar-track {
        background: #edf2f5;
        border-radius: 10px;
    }

    #contenedor_notas_academicas::-webkit-scrollbar-thumb {
        background: #9eb4c2;
        border-radius: 10px;
    }

    #contenedor_notas_academicas::-webkit-scrollbar-thumb:hover {
        background: #718c9d;
    }


    /* =========================================================
   RESPONSIVE
   ========================================================= */

    @media (max-width: 900px) {

        #modulo_visualizar_notas_academicas {
            padding: 16px;
        }

        .busqueda_notas_academicas {
            padding: 18px;
        }

        #formulario_busqueda {
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .contenedor_visualizar_notas_academicas h2 {
            font-size: 22px;
        }
    }


    @media (max-width: 600px) {

        #modulo_visualizar_notas_academicas {
            padding: 12px;
        }

        .busqueda_notas_academicas {
            padding: 14px;
            border-radius: 9px;
        }

        #formulario_busqueda select,
        #formulario_busqueda input[type="text"] {
            height: 42px;
        }

        .tabla-calificaciones {
            font-size: 13px;
        }

        .tabla-calificaciones thead th {
            height: 44px;
            padding: 8px 10px;
        }

        .tabla-calificaciones tbody td {
            height: 42px;
            padding: 8px 10px;
        }
    }
</style>

<section id="modulo_visualizar_notas_academicas">
    <div class="contenedor_visualizar_notas_academicas">
        <h2>Visualizar Notas Académicas</h2>

        <div class="busqueda_notas_academicas">
            <form method="post" id="formulario_busqueda">
                {% csrf_token %}
                <label for="perfiles_asignados">Perfil Asignado:</label>
                <select name="perfiles_asignados" id="perfiles_asignados" style="display: none;"></select>

                <input type="text" name="perfiles_asignados" id="perfil_asignado" readonly style="display: none;">

                <label for="nucleo_asignado">Núcleo Asignado:</label>
                <select name="nucleo_asignado" id="nucleo_asignado"></select>

                <label for="pnf_asignado">P.N.F Asignado:</label>
                <select name="pnf_asignado" id="pnf_asignado"></select>

                <div id="contenedor_seleccion_docente" style="display: none;">
                    <label for="seleccion_docente">Docente:</label>
                    <select name="seleccion_docente" id="seleccion_docente">
                        <option value="" selected>Selecciona un Docente</option>
                    </select>
                </div>

                <label for="trayecto_academico">Trayecto Académico:</label>
                <select name="trayecto_academico" id="trayecto_academico">
                    <option value='' selected>Debe seleccionar el Trayecto Académico</option>
                </select>

                <label for="materia_asignada">Materia(s) Asignada(s):</label>
                <select name="materia_asignada" id="materia_asignada"></select>

                <label for="periodo_academico">Periodo Académico:</label>
                <select name="periodo_academico" id="periodo_academico"></select>

                <label for="fecha_registro_academico">Fechas Registro Académico:</label>
                <select name="fecha_registro_academico" id="fecha_registro_academico"></select>
            </form>
        </div>

        <div id="contenedor_notas_academicas"></div>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Docente/Notas_Academicas/visualizas_notas_academicas.js' %}"></script>

{% endblock %}
