{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<style>
    /* ==========================================================
   MÓDULO — MATERIAS PRESENTAR
   ========================================================== */

    #modulo_materias_presentar {
        width: 100%;
        min-height: 100%;
        padding: 24px;
        box-sizing: border-box;
    }

    .contenedor_materias_presentar {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        box-sizing: border-box;
    }


    /* ==========================================================
   TÍTULO PRINCIPAL
   ========================================================== */

    .contenedor_materias_presentar>h2 {
        margin: 0 0 24px;
        padding-bottom: 14px;

        border-bottom: 2px solid #dfe6eb;

        color: #102f4e;
        font-size: 24px;
        font-weight: 700;
    }


    /* ==========================================================
   CONTENEDOR DE BÚSQUEDA
   ========================================================== */

    .conetendor_busqueda {
        width: 100%;
        margin-bottom: 24px;
        padding: 24px;

        background: #ffffff;

        border: 1px solid #dfe6eb;
        border-radius: 10px;

        box-sizing: border-box;

        box-shadow: 0 3px 12px rgba(16, 47, 78, 0.06);
    }


    /* ==========================================================
   FORMULARIO DE BÚSQUEDA
   ========================================================== */

    .conetendor_busqueda form {
        display: flex;
        flex-direction: column;
        gap: 6px;

        width: 100%;
    }


    /* ==========================================================
   LABELS
   ========================================================== */

    .conetendor_busqueda label {
        display: block;

        margin-top: 8px;

        color: #102f4e;
        font-size: 14px;
        font-weight: 600;
    }

    .conetendor_busqueda label:first-child {
        margin-top: 0;
    }


    /* ==========================================================
   SELECTS
   ========================================================== */

    .conetendor_busqueda select {
        width: 100%;
        height: 42px;

        padding: 0 38px 0 12px;

        box-sizing: border-box;

        border: 1px solid #cbd5dc;
        border-radius: 7px;

        background-color: #ffffff;

        color: #263746;

        font-family: inherit;
        font-size: 14px;

        outline: none;

        cursor: pointer;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background-color 0.2s ease;
    }

    .conetendor_busqueda select:hover {
        border-color: #00779e;
    }

    .conetendor_busqueda select:focus {
        border-color: #00779e;

        box-shadow:
            0 0 0 3px rgba(0, 119, 158, 0.12);
    }

    .conetendor_busqueda select:disabled {
        background-color: #f1f4f6;

        border-color: #d9e0e4;

        color: #8a969f;

        cursor: not-allowed;
    }

    .conetendor_busqueda select option {
        background: #ffffff;
        color: #263746;
    }


    /* ==========================================================
   CONTENEDOR DE ACTIVIDADES
   ========================================================== */

    .contenedor_actividades {
        width: 100%;
    }

    #contenedor_datos_academicos {
        display: block;

        width: 100%;
    }


    /* ==========================================================
   BLOQUE DE CADA TRAYECTO
   ========================================================== */

    .bloque_materias_trayecto {
        width: 100%;
        margin-bottom: 24px;

        background: #ffffff;

        border: 1px solid #dfe6eb;
        border-radius: 10px;

        overflow: hidden;

        box-shadow: 0 3px 12px rgba(16, 47, 78, 0.06);
    }

    .bloque_materias_trayecto:last-child {
        margin-bottom: 0;
    }


    /* ==========================================================
   TÍTULO DEL TRAYECTO
   ========================================================== */

    .titulo_trayecto {
        width: 100%;

        padding: 15px 20px;

        box-sizing: border-box;

        background: #f4f8fa;

        border-bottom: 1px solid #dfe6eb;
    }

    .titulo_trayecto h3 {
        margin: 0;

        color: #102f4e;

        font-size: 17px;
        font-weight: 700;
    }


    /* ==========================================================
   TABLA
   ========================================================== */

    .contenedor_tabla_materias {
        width: 100%;

        overflow-x: auto;
    }

    .tabla_materias_presentadas {
        width: 100%;

        border-collapse: collapse;

        table-layout: fixed;
    }


    /* ==========================================================
   CELDAS
   ========================================================== */

    .tabla_materias_presentadas th,
    .tabla_materias_presentadas td {
        padding: 13px 16px;

        border-bottom: 1px solid #e6ebee;

        text-align: left;
        vertical-align: middle;

        font-size: 14px;
    }


    /* ==========================================================
   ENCABEZADO TABLA
   ========================================================== */

    .tabla_materias_presentadas thead th {
        background: #102f4e;

        color: #ffffff;

        font-weight: 600;

        white-space: nowrap;
    }

    .tabla_materias_presentadas thead th:nth-child(1) {
        width: 18%;
    }

    .tabla_materias_presentadas thead th:nth-child(2) {
        width: 52%;
    }

    .tabla_materias_presentadas thead th:nth-child(3) {
        width: 30%;
    }


    /* ==========================================================
   CUERPO TABLA
   ========================================================== */

    .tabla_materias_presentadas tbody td {
        background: #ffffff;

        color: #344552;
    }

    .tabla_materias_presentadas tbody tr:last-child td {
        border-bottom: none;
    }

    .tabla_materias_presentadas tbody tr:hover td {
        background: #f7fafb;
    }


    /* ==========================================================
   MENSAJE DENTRO DE TABLA
   ========================================================== */

    .tabla_materias_presentadas .mensaje_tabla {
        padding: 24px 16px;

        background: #fafcfd;

        color: #6c7880;

        text-align: center;

        font-style: italic;
    }


    /* ==========================================================
   MENSAJE SIN MATERIAS
   ========================================================== */

    .mensaje_sin_materias {
        width: 100%;
        min-height: 120px;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        box-sizing: border-box;

        background: #ffffff;

        border: 1px solid #dfe6eb;
        border-radius: 10px;

        color: #6c7880;

        font-size: 14px;

        box-shadow: 0 3px 12px rgba(16, 47, 78, 0.06);
    }


    /* ==========================================================
   BOTONES / CONTROLES
   ========================================================== */

    .boton_materia {
        min-width: 80px;
        height: 34px;

        padding: 0 15px;

        border: 1px solid #00779e;
        border-radius: 6px;

        background: #00779e;

        color: #ffffff;

        font-family: inherit;
        font-size: 13px;
        font-weight: 600;

        cursor: pointer;

        transition:
            background-color 0.2s ease,
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            transform 0.15s ease;
    }

    .boton_materia:hover {
        background: #006683;

        border-color: #006683;

        box-shadow:
            0 3px 8px rgba(0, 119, 158, 0.20);
    }

    .boton_materia:active {
        transform: translateY(1px);
    }

    .boton_materia:focus {
        outline: none;

        box-shadow:
            0 0 0 3px rgba(0, 119, 158, 0.15);
    }


    /* ==========================================================
   ESTADOS DE LOS SELECTS
   ========================================================== */

    .conetendor_busqueda select:invalid {
        color: #7c8991;
    }

    .conetendor_busqueda select:disabled {
        opacity: 0.75;
    }


    /* ==========================================================
   TABLET
   ========================================================== */

    @media (max-width: 900px) {

        #modulo_materias_presentar {
            padding: 18px;
        }

        .conetendor_busqueda {
            padding: 20px;
        }

        .tabla_materias_presentadas {
            min-width: 650px;
        }
    }


    /* ==========================================================
   MÓVIL
   ========================================================== */

    @media (max-width: 600px) {

        #modulo_materias_presentar {
            padding: 12px;
        }

        .contenedor_materias_presentar>h2 {
            margin-bottom: 18px;

            font-size: 20px;
        }

        .conetendor_busqueda {
            padding: 16px;

            border-radius: 8px;
        }

        .conetendor_busqueda label {
            font-size: 13px;
        }

        .conetendor_busqueda select {
            height: 40px;

            font-size: 13px;
        }

        .titulo_trayecto {
            padding: 13px 15px;
        }

        .titulo_trayecto h3 {
            font-size: 15px;
        }

        .tabla_materias_presentadas {
            min-width: 620px;
        }

        .tabla_materias_presentadas th,
        .tabla_materias_presentadas td {
            padding: 11px 12px;

            font-size: 13px;
        }
    }
</style>

<section id="modulo_materias_presentar">
    <div class="contenedor_materias_presentar">
        <h2>Materias Presentar</h2>

        <div class="conetendor_busqueda">
            <form method="post">
                {% csrf_token %}
                <label for="nucleo_presentar">Núcleo:</label>
                <select name="nucleo_presentar" id="nucleo_presentar"></select>

                <label for="pnfs_cursar">P.N.F:</label>
                <select name="pnfs_cursar" id="pnfs_cursar"></select>

                <label for="trayecto_academico">Trayectos Académicos</label>
                <select name="trayecto_academico" id="trayecto_academico"></select>
            </form>
        </div>

        <div class="contenedor_actividades">
            <id id="contenedor_datos_academicos"></id>
        </div>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Estudiantes/materias_presentar.js' %}"></script>

{% endblock %}
