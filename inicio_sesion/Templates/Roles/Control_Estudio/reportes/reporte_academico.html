<section id="ReporteAcademicoCASRCE">

    <div class="ReporteAcademicoCASRCE-cabecera">

        <div class="ReporteAcademicoCASRCE-icono">
            <i class="fa-solid fa-chart-line"></i>
        </div>

        <div class="ReporteAcademicoCASRCE-informacion">

            <span class="ReporteAcademicoCASRCE-categoria">
                REPORTE ACADÉMICO
            </span>

            <h2>
                Reporte Académico
            </h2>

            <p>
                Consulta información consolidada sobre el rendimiento
                académico, promedios, asistencia y condiciones de los
                estudiantes registrados en CARSCE.
            </p>

        </div>

    </div>


    <div class="ReporteAcademicoCASRCE-detalles">

        <div class="ReporteAcademicoCASRCE-detalle">

            <i class="fa-solid fa-chart-column"></i>

            <div>
                <span>Información</span>
                <strong>Rendimiento académico</strong>
            </div>

        </div>


        <div class="ReporteAcademicoCASRCE-detalle">

            <i class="fa-solid fa-graduation-cap"></i>

            <div>
                <span>Datos</span>
                <strong>Promedios y condiciones</strong>
            </div>

        </div>


        <div class="ReporteAcademicoCASRCE-detalle">

            <i class="fa-solid fa-file-pdf"></i>

            <div>
                <span>Formato</span>
                <strong>Documento PDF</strong>
            </div>

        </div>

    </div>


    <div class="ReporteAcademicoCASRCE-acciones">

        <a
            href="{% url 'reporte_academico_pdf' %}"
            class="ReporteAcademicoCASRCE-boton-pdf"
            target="_blank"
        >

            <i class="fa-solid fa-file-pdf"></i>

            <span>
                Generar reporte PDF
            </span>

        </a>

    </div>

</section>
