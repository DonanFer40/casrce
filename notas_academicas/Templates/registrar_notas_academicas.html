{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<style>
    /* =========================================================
   REGISTRAR NOTAS ACADÉMICAS
   ========================================================= */

    #modulo_registrar_notas_academicas {
        width: 100%;
        min-height: 100%;
        padding: 25px;
        box-sizing: border-box;
        background: #f8fbfc;
    }

    .contenedor_registrar_notas_academicas {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 25px;
        box-sizing: border-box;

        background: #ffffff;
        border: 2px solid #dce9ed;
        border-radius: 14px;
    }


    /* =========================================================
   TÍTULO
   ========================================================= */

    .contenedor_registrar_notas_academicas h2 {
        margin: 0 0 25px;

        color: #00445f;
        font-size: 25px;
        font-weight: 700;

        border-bottom: 2px solid #00b6ea;
        padding-bottom: 12px;
    }


    /* =========================================================
   FORMULARIO
   ========================================================= */

    #formulario_registrar {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px 20px;
    }


    /* =========================================================
   LABEL
   ========================================================= */

    #formulario_registrar label {
        display: block;
        margin-bottom: 7px;

        color: #00445f;
        font-size: 14px;
        font-weight: 600;
    }


    /* =========================================================
   SELECT E INPUT
   ========================================================= */

    #formulario_registrar select,
    #formulario_registrar input[type="text"] {
        width: 100%;
        height: 44px;

        padding: 0 13px;
        box-sizing: border-box;

        border: 2px solid #cbdde3;
        border-radius: 8px;

        background: #ffffff;
        color: #3f5158;

        font-size: 14px;
        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;
    }

    #formulario_registrar select:focus,
    #formulario_registrar input[type="text"]:focus {
        border-color: #00b6ea;
        box-shadow: 0 0 0 3px rgba(0, 182, 234, 0.12);
    }


    /* =========================================================
   INPUT SOLO LECTURA
   ========================================================= */

    #formulario_registrar input[readonly] {
        background: #f1f6f8;
        color: #607279;
        cursor: not-allowed;
    }


    /* =========================================================
   BOTÓN
   ========================================================= */

    .contenedor_boton_notas {
        grid-column: 1 / -1;

        display: flex;
        justify-content: flex-end;

        margin-top: 5px;
        padding-top: 18px;

        border-top: 1px solid #e2ecef;
    }

    #btn_registrar_notas {
        min-width: 130px;
        height: 42px;

        padding: 0 20px;

        border: none;
        border-radius: 8px;

        background: #00445f;
        color: #ffffff;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;

        transition: 0.2s ease;
    }

    #btn_registrar_notas:hover {
        background: #00b6ea;
    }

    #btn_registrar_notas:active {
        transform: scale(0.98);
    }


    /* =========================================================
   CONTENEDOR DE NOTAS
   ========================================================= */

    #contenedor_notas_academicas {
        grid-column: 1 / -1;

        width: 100%;
        margin-top: 10px;
    }


    /* =========================================================
   CONTENEDOR DE LA TABLA
   ========================================================= */

    .contenedor_tabla_notas {
        width: 100%;
        margin-top: 20px;

        border: 2px solid #dce9ed;
        border-radius: 10px;

        overflow-x: auto;
        background: #ffffff;
    }


    /* =========================================================
   TABLA
   ========================================================= */

    .tabla_notas {
        width: 100%;
        min-width: 850px;

        border-collapse: collapse;
    }

    .tabla_notas thead {
        background: #00445f;
    }

    .tabla_notas th {
        padding: 13px 12px;

        color: #ffffff;

        font-size: 12px;
        font-weight: 600;

        text-align: center;
        white-space: nowrap;
    }

    .tabla_notas td {
        padding: 10px 12px;

        border-bottom: 1px solid #e3ecef;

        color: #45575e;

        font-size: 13px;

        text-align: center;
        vertical-align: middle;
    }

    .tabla_notas tbody tr {
        transition: background 0.2s ease;
    }

    .tabla_notas tbody tr:hover {
        background: #f5fafc;
    }

    .tabla_notas tbody tr:last-child td {
        border-bottom: none;
    }


    /* =========================================================
   COLUMNA DEL ESTUDIANTE
   ========================================================= */

    .tabla_notas .nombre_estudiante {
        min-width: 190px;

        text-align: left;

        color: #00445f;
        font-weight: 600;
    }

    .tabla_notas .cedula_estudiante {
        white-space: nowrap;
    }


    /* =========================================================
   INPUTS DE CALIFICACIONES
   ========================================================= */

    .tabla_notas input[type="number"],
    .tabla_notas input[type="text"] {
        width: 70px;
        height: 36px;

        padding: 0 8px;
        box-sizing: border-box;

        border: 2px solid #cbdde3;
        border-radius: 7px;

        background: #ffffff;

        color: #00445f;

        font-size: 14px;
        font-weight: 600;

        text-align: center;

        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;
    }


    /* =========================================================
   FOCUS INPUT CALIFICACIÓN
   ========================================================= */

    .tabla_notas input[type="number"]:focus,
    .tabla_notas input[type="text"]:focus {
        border-color: #00b6ea;

        box-shadow:
            0 0 0 3px rgba(0, 182, 234, 0.12);

        background: #fafdfe;
    }


    /* =========================================================
   INPUT CON CALIFICACIÓN VÁLIDA
   ========================================================= */

    .tabla_notas input.calificacion_valida {
        border-color: #48a868;
        background: #f2fbf5;
    }


    /* =========================================================
   INPUT CON ERROR
   ========================================================= */

    .tabla_notas input.calificacion_error {
        border-color: #d64545;
        background: #fff5f5;
    }


    /* =========================================================
   INPUT DESHABILITADO
   ========================================================= */

    .tabla_notas input:disabled {
        background: #edf2f4;
        color: #87959a;
        cursor: not-allowed;
    }


    /* =========================================================
   QUITAR FLECHAS DEL INPUT NUMBER
   ========================================================= */

    .tabla_notas input[type="number"]::-webkit-inner-spin-button,
    .tabla_notas input[type="number"]::-webkit-outer-spin-button {
        margin: 0;
        -webkit-appearance: none;
    }

    .tabla_notas input[type="number"] {
        appearance: textfield;
    }


    /* =========================================================
   CABECERA DE LA TABLA
   ========================================================= */

    .encabezado_notas {
        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 15px;

        margin-top: 20px;
        padding: 15px 18px;

        border: 1px solid #dce9ed;
        border-bottom: none;

        border-radius: 10px 10px 0 0;

        background: #f8fbfc;
    }

    .encabezado_notas h3 {
        margin: 0;

        color: #00445f;
        font-size: 17px;
    }

    .encabezado_notas p {
        margin: 4px 0 0;

        color: #68777c;
        font-size: 13px;
    }


    /* =========================================================
   RESPONSIVE
   ========================================================= */

    @media (max-width: 750px) {

        #modulo_registrar_notas_academicas {
            padding: 15px;
        }

        .contenedor_registrar_notas_academicas {
            padding: 18px;
        }

        #formulario_registrar {
            grid-template-columns: 1fr;
        }

        .contenedor_boton_notas {
            justify-content: stretch;
        }

        #btn_registrar_notas {
            width: 100%;
        }
    }
</style>

<section id="modulo_registrar_notas_academicas">
    <div class="contenedor_registrar_notas_academicas">
        <h2>Registrar Notas Académicas</h2>

        <form method="post" id="formulario_registrar">
            {% csrf_token %}
            <label for="nucleo_asignado">Núcleo Asignado:</label>
            <select name="nucleo_asignado" id="nucleo_asignado"></select>

            <label for="pnf_asignado">P.N.F Asignado:</label>
            <select name="pnf_asignado" id="pnf_asignado"></select>

            <label for="materia_asignada">Materia(s) Asignada(s):</label>
            <select name="materia_asignada" id="materia_asignada">
                <option value='' selected>Debe seleccionar la materia</option>
            </select>

            <label for="periodo_academico">Periodo Académico:</label>
            <select name="periodo_academico" id="periodo_academico">
                <option value='' selected>Selecciona la materia</option>
            </select>

            <label for="trayecto_academico">Trayecto Académico:</label>
            <input type="text" name="trayecto_academico" id="trayecto_academico" readonly>

            <div class="contenedor_boton_notas">
                <input type="submit" value="Registrar" id="btn_registrar_notas">
            </div>

            <div id="contenedor_notas_academicas"></div>
        </form>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Docente/registrar_notas_academicas.js' %}"></script>

{% endblock %}
