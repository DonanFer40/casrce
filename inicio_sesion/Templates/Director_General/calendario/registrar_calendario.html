{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section id="modulo_calendario">
    <div class="contenedor_modulo_calendario">
        <h3>Calendario Notas Académicas <br>UPT "José Félix Ribas"</h3>

        <div class="contenedor_registrar_calendario">
            <h4>Registrar Calendario Notas Académicas</h4>

            <form method="post" id="formulario_registrar">
                {% csrf_token %}

                <label for="tipo">Tipo:</label>
                <select name="tipo" id="tipo" required></select>

                <div id="contenedor_periodo" style="display: none;">
                    <label for="periodo">Período académico:</label>
                    <select name="periodo" id="periodo"></select>
                </div>

                <label for="fecha_inicio">Fecha de inicio:</label>
                <input type="date" name="fecha_inicio" id="fecha_inicio" required>

                <label for="fecha_final">Fecha final:</label>
                <input type="date" name="fecha_final" id="fecha_final" required>

                <label for="descripcion">Descripción:</label>
                <input type="text" name="descripcion" id="descripcion" maxlength="150"
                    placeholder="Descripción del período o actividad">

                <input type="submit" id="btn_registro" value="Registrar Calendario Académico">
            </form>
        </div>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Director_General/Calendario/registrar_calendario.js' %}"></script>

{% endblock %}
