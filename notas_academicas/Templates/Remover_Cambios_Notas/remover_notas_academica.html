{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<style>
    /* =========================================================
   REMOVER CAMBIO DE NOTA
   ========================================================= */

    #modulo_remover_cambio_nota {
        width: 100%;
        padding: 25px 0;
        font-family: Calibri, Arial, sans-serif;
    }

    .contenedor_remover_cambio_nota {
        width: 95%;
        max-width: 1500px;
        margin: 0 auto;
    }

    .contenedor_remover_cambio_nota h2 {
        margin: 0 0 25px;
        padding-bottom: 12px;
        border-bottom: 2px solid #00445f;
        color: #102f4e;
        font-size: 25px;
        font-weight: 700;
    }


    /* =========================================================
   FORMULARIO
   ========================================================= */

    .remover_cambio_nota {
        width: 100%;
        padding: 25px;
        background: #ffffff;
        border: 1px solid #d9e2e7;
        border-radius: 10px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        box-sizing: border-box;
    }

    .remover_cambio_nota form {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(250px, 1fr));
        gap: 18px 25px;
        align-items: end;
    }

    .remover_cambio_nota label {
        display: block;
        margin-bottom: 7px;
        color: #102f4e;
        font-size: 15px;
        font-weight: 600;
    }

    .remover_cambio_nota select,
    .remover_cambio_nota input[type="text"] {
        width: 100%;
        height: 43px;
        padding: 0 12px;
        box-sizing: border-box;

        border: 1px solid #b9c8d0;
        border-radius: 6px;

        background-color: #ffffff;
        color: #263746;

        font-family: Calibri, Arial, sans-serif;
        font-size: 15px;

        outline: none;
        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .remover_cambio_nota select:focus,
    .remover_cambio_nota input[type="text"]:focus {
        border-color: #00779e;
        box-shadow: 0 0 0 3px rgba(0, 119, 158, 0.12);
    }

    .remover_cambio_nota select {
        cursor: pointer;
    }

    .remover_cambio_nota input[readonly] {
        background-color: #f1f5f7;
        color: #52636d;
        cursor: not-allowed;
    }


    /* =========================================================
   BOTÓN
   ========================================================= */

    .contenedor_boton_notas {
        grid-column: 1 / -1;

        display: flex;
        justify-content: flex-end;

        margin-top: 5px;
        padding-top: 20px;

        border-top: 1px solid #e1e7ea;
    }

    .contenedor_boton_notas input[type="submit"] {
        min-width: 130px;
        height: 43px;
        padding: 0 22px;

        border: none;
        border-radius: 6px;

        background-color: #00445f;
        color: #ffffff;

        font-family: Calibri, Arial, sans-serif;
        font-size: 15px;
        font-weight: 600;

        cursor: pointer;

        transition:
            background-color 0.2s ease,
            transform 0.15s ease,
            box-shadow 0.2s ease;
    }

    .contenedor_boton_notas input[type="submit"]:hover {
        background-color: #00779e;
        box-shadow: 0 4px 10px rgba(0, 68, 95, 0.18);
    }

    .contenedor_boton_notas input[type="submit"]:active {
        transform: translateY(1px);
    }


    /* =========================================================
   CONTENEDOR DE RESULTADOS
   ========================================================= */

    #contenedor_notas_academicas {
        grid-column: 1 / -1;

        width: 100%;
        margin-top: 10px;

        overflow-x: auto;
        box-sizing: border-box;
    }


    /* =========================================================
   MENSAJES
   ========================================================= */

    #contenedor_notas_academicas>p {
        width: 100%;
        margin: 10px 0 0;
        padding: 15px;

        box-sizing: border-box;

        border: 1px solid #d7e1e6;
        border-radius: 6px;

        background-color: #f5f8fa;
        color: #52636d;

        text-align: center;
        font-size: 15px;
    }


    /* =========================================================
   TABLA DE CALIFICACIONES
   ========================================================= */

    .tabla-calificaciones {
        width: 100%;
        min-width: 950px;

        margin-top: 10px;

        border-collapse: separate;
        border-spacing: 0;

        overflow: hidden;

        border: 1px solid #cfdbe1;
        border-radius: 8px;

        background-color: #ffffff;

        font-family: Calibri, Arial, sans-serif;
        font-size: 14px;
    }

    .tabla-calificaciones thead th {
        padding: 12px 10px;

        border-right: 1px solid #d5e0e5;
        border-bottom: 2px solid #00384d;

        background-color: #00445f;
        color: #ffffff;

        text-align: center;
        font-weight: 600;

        white-space: nowrap;
    }

    .tabla-calificaciones thead th:last-child {
        border-right: none;
    }

    .tabla-calificaciones tbody td {
        padding: 10px;

        border-right: 1px solid #e0e7eb;
        border-bottom: 1px solid #e0e7eb;

        color: #263746;

        text-align: center;
        vertical-align: middle;

        white-space: nowrap;
    }

    .tabla-calificaciones tbody tr:last-child td {
        border-bottom: none;
    }

    .tabla-calificaciones tbody td:last-child {
        border-right: none;
    }

    .tabla-calificaciones tbody tr:hover {
        background-color: #f5f9fb;
    }


    /* =========================================================
   DATOS DEL ESTUDIANTE
   ========================================================= */

    .tabla-calificaciones tbody td:nth-child(2) {
        min-width: 190px;
        text-align: left;
    }

    .tabla-calificaciones tbody td:nth-child(3) {
        min-width: 100px;
    }


    /* =========================================================
   CALIFICACIONES
   ========================================================= */

    .celda-calificacion {
        min-width: 75px;

        color: #102f4e !important;
        font-weight: 600;
    }


    /* =========================================================
   ASISTENCIA
   ========================================================= */

    .celda-asistencia {
        min-width: 90px;

        color: #102f4e !important;
        font-weight: 600;
    }


    /* =========================================================
   PROMEDIO
   ========================================================= */

    .celda-promedio {
        min-width: 85px;

        color: #102f4e !important;
        font-weight: 700;
    }


    /* =========================================================
   CONDICIÓN
   ========================================================= */

    .celda-condicion {
        min-width: 120px;

        color: #263746 !important;
        font-weight: 600;
    }


    /* =========================================================
   REVERSIÓN
   ========================================================= */

    .celda-reversion {
        width: 90px;
        min-width: 90px;

        background-color: #fafcfd;
    }

    .tabla-calificaciones thead th:last-child {
        background-color: #102f4e;
    }


    /* =========================================================
   CHECKBOX DE REVERSIÓN
   ========================================================= */

    .input-reversion {
        width: 18px;
        height: 18px;

        margin: 0;

        accent-color: #00779e;

        cursor: pointer;

        vertical-align: middle;
    }

    .input-reversion:focus {
        outline: 2px solid rgba(0, 119, 158, 0.25);
        outline-offset: 2px;
    }


    /* =========================================================
   RESPONSIVE
   ========================================================= */

    @media (max-width: 900px) {

        .contenedor_remover_cambio_nota {
            width: 96%;
        }

        .remover_cambio_nota {
            padding: 20px;
        }

        .remover_cambio_nota form {
            grid-template-columns: 1fr;
        }

        .contenedor_boton_notas {
            grid-column: 1;
        }

        #contenedor_notas_academicas {
            grid-column: 1;
        }
    }


    @media (max-width: 600px) {

        #modulo_remover_cambio_nota {
            padding: 15px 0;
        }

        .contenedor_remover_cambio_nota {
            width: 94%;
        }

        .contenedor_remover_cambio_nota h2 {
            font-size: 21px;
        }

        .remover_cambio_nota {
            padding: 15px;
            border-radius: 8px;
        }

        .remover_cambio_nota select,
        .remover_cambio_nota input[type="text"] {
            height: 41px;
        }

        .contenedor_boton_notas {
            justify-content: stretch;
        }

        .contenedor_boton_notas input[type="submit"] {
            width: 100%;
        }
    }
</style>

<section id="modulo_remover_cambio_nota">
    <div class="contenedor_remover_cambio_nota">
        <h2>Modificar Notas Académicas</h2>

        <div class="remover_cambio_nota">
            <form method="post">
                {% csrf_token %}
                <label for="pnf_asignado">P.N.F Asignado:</label>
                <select name="pnf_asignado" id="pnf_asignado"></select>

                <label for="seleccion_docente">Docente:</label>
                <select name="seleccion_docente" id="seleccion_docente">
                    <option value="" selected>Selecciona un Docente</option>
                </select>

                <label for="trayecto_academico">Trayecto Académico:</label>
                <select name="trayecto_academico" id="trayecto_academico">
                    <option value='' selected>Debe seleccionar el Trayecto Académico</option>
                </select>

                <label for="materia_asignada">Materia(s) Asignada(s):</label>
                <select name="materia_asignada" id="materia_asignada"></select>

                <label for="periodo_academico">Periodo Académico:</label>
                <input type="text" name="periodo_academico" id="periodo_academico" readonly>

                <div class="contenedor_boton_notas">
                    <input type="submit" value="Remover">
                </div>

                <div id="contenedor_notas_academicas"></div>
            </form>
        </div>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Docente/Remover_Cambios_Notas/remover_notas_academica.js' %}"></script>

{% endblock %}
