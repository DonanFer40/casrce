{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<section id="modulo_registrar_evaluacion_reparacion">
    <div class="contenedor_registrar_evaluacion_reparacion">
        <h2>Registrar Evaluación de Reparación</h2>

        <form method="post" id="formulario_registrar">
            {% csrf_token %}

            <label for="nucleo_asignado">Núcleo Asignado:</label>
            <select name="nucleo_asignado" id="nucleo_asignado"></select>

            <label for="pnf_asignado">P.N.F Asignado:</label>
            <select name="pnf_asignado" id="pnf_asignado"></select>

            <label for="materia_asignada">Materia Asignada:</label>
            <select name="materia_asignada" id="materia_asignada"></select>

            <label for="trayecto_academico">Trayecto Académico:</label>
            <input type="text" name="trayecto_academico" id="trayecto_academico" readonly>

            <h3>Detalle de Evaluación</h3>
            <div id="contenedor_detalles_evaluacion">
                <div class="detalle_evaluacion">
                    <label>Tipo de Evaluación:</label>
                    <select name="tipo_evaluacion[]" class="tipo_evaluacion"></select>

                    <label>Porcentaje:</label>
                    <input type="text" name="porcentaje[]" class="porcentaje_evaluacion" placeholder="Porcentaje">

                    <button type="button" class="btn_eliminar_detalle">Eliminar</button>
                </div>
            </div>

            <button type="button" id="btn_agregar_detalle">+ Agregar detalle</button>

            <div class="contenedor_boton_evaluacion">
                <input type="submit" value="Registrar Evaluación">
            </div>
        </form>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Docente/registrar_examen_reparacion.js' %}"></script>

{% endblock %}
