{% extends 'Estructura/base.html' %}

{% block content %}

{% load static %}

<style>
    /* =========================================================
   MODIFICAR NOTAS ACADÉMICAS
   ========================================================= */

    #modulo_modificar_notas_academicas {
        width: 100%;
        padding: 30px 20px;
        box-sizing: border-box;
    }

    .contenedor_modificar_notas_academicas {
        width: min(100%, 1100px);
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #dfe6eb;
        border-radius: 12px;
        padding: 30px;
        box-sizing: border-box;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    /* Título */

    .contenedor_modificar_notas_academicas h2 {
        margin: 0 0 30px;
        padding-bottom: 15px;
        border-bottom: 2px solid #00445f;
        color: #00445f;
        font-size: 25px;
        font-weight: 700;
    }

    /* Formulario */

    .modificar_notas_academicas {
        width: 100%;
    }

    #formulario_actualizar {
        width: 100%;
        display: grid;
        grid-template-columns: 220px 1fr;
        column-gap: 20px;
        row-gap: 18px;
        align-items: center;
    }

    /* Labels */

    #formulario_actualizar>label,
    #contenedor_seleccion_docente>label {
        color: #263943;
        font-size: 14px;
        font-weight: 600;
        margin: 0;
    }

    /* Inputs y Selects */

    #formulario_actualizar input[type="text"],
    #formulario_actualizar select {
        width: 100%;
        height: 43px;
        padding: 0 13px;
        border: 1px solid #cbd5db;
        border-radius: 7px;
        background: #ffffff;
        color: #263943;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        box-sizing: border-box;
        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background-color 0.2s ease;
    }

    /* Select */

    #formulario_actualizar select {
        cursor: pointer;
        appearance: auto;
    }

    /* Focus */

    #formulario_actualizar input[type="text"]:focus,
    #formulario_actualizar select:focus {
        border-color: #00779e;
        box-shadow: 0 0 0 3px rgba(0, 119, 158, 0.12);
    }

    /* Readonly */

    #formulario_actualizar input[readonly] {
        background: #f2f5f7;
        color: #53636c;
        cursor: default;
    }

    /* Placeholder / opciones */

    #formulario_actualizar select:invalid,
    #formulario_actualizar select option[value=""] {
        color: #71808a;
    }

    /* =========================================================
   CONTENEDOR DEL DOCENTE
   ========================================================= */

    #contenedor_seleccion_docente {
        grid-column: 1 / -1;
        width: 100%;
        display: grid;
        grid-template-columns: 220px 1fr;
        column-gap: 20px;
        align-items: center;
    }

    /* =========================================================
   BOTÓN
   ========================================================= */

    .contenedor_boton_notas {
        grid-column: 1 / -1;
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
        padding-top: 20px;
        border-top: 1px solid #e1e7eb;
    }

    #btn_registrar_notas {
        min-width: 160px;
        height: 44px;
        padding: 0 25px;
        border: none;
        border-radius: 7px;
        background: #00445f;
        color: #ffffff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
            background-color 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    #btn_registrar_notas:hover {
        background: #00779e;
        box-shadow: 0 4px 10px rgba(0, 68, 95, 0.18);
    }

    #btn_registrar_notas:active {
        transform: translateY(1px);
    }

    #btn_registrar_notas:disabled {
        background: #9aa8af;
        cursor: not-allowed;
        box-shadow: none;
    }

    /* =========================================================
   CONTENEDOR DE NOTAS
   ========================================================= */

    #contenedor_notas_academicas {
        grid-column: 1 / -1;
        width: 100%;
        margin-top: 10px;
    }

    /* =========================================================
   TABLA DE NOTAS - SI ES GENERADA DINÁMICAMENTE
   ========================================================= */

    #contenedor_notas_academicas table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        overflow: hidden;
        border: 1px solid #d9e1e5;
        border-radius: 8px;
    }

    #contenedor_notas_academicas th {
        padding: 12px 10px;
        background: #00445f;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
    }

    #contenedor_notas_academicas td {
        padding: 11px 10px;
        border-bottom: 1px solid #e2e7ea;
        color: #344650;
        font-size: 13px;
        text-align: center;
    }

    #contenedor_notas_academicas tbody tr:last-child td {
        border-bottom: none;
    }

    #contenedor_notas_academicas tbody tr:hover {
        background: #f5f9fb;
    }

    /* Inputs dentro de la tabla */

    #contenedor_notas_academicas input,
    #contenedor_notas_academicas select {
        width: 100%;
        height: 38px;
        padding: 0 9px;
        border: 1px solid #cbd5db;
        border-radius: 6px;
        box-sizing: border-box;
        outline: none;
        font-family: inherit;
        font-size: 13px;
    }

    #contenedor_notas_academicas input:focus,
    #contenedor_notas_academicas select:focus {
        border-color: #00779e;
        box-shadow: 0 0 0 3px rgba(0, 119, 158, 0.10);
    }

    /* =========================================================
   RESPONSIVE
   ========================================================= */

    @media (max-width: 800px) {

        #modulo_modificar_notas_academicas {
            padding: 20px 12px;
        }

        .contenedor_modificar_notas_academicas {
            padding: 22px 18px;
        }

        #formulario_actualizar {
            grid-template-columns: 1fr;
            gap: 10px;
        }

        #formulario_actualizar>label {
            margin-top: 8px;
        }

        #contenedor_seleccion_docente {
            grid-column: 1;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .contenedor_boton_notas {
            grid-column: 1;
            justify-content: stretch;
        }

        #btn_registrar_notas {
            width: 100%;
        }

        #contenedor_notas_academicas {
            grid-column: 1;
            overflow-x: auto;
        }

        #contenedor_notas_academicas table {
            min-width: 700px;
        }
    }

    @media (max-width: 500px) {

        .contenedor_modificar_notas_academicas {
            padding: 18px 14px;
            border-radius: 8px;
        }

        .contenedor_modificar_notas_academicas h2 {
            font-size: 21px;
            margin-bottom: 22px;
        }

        #formulario_actualizar input[type="text"],
        #formulario_actualizar select {
            height: 41px;
            font-size: 13px;
        }

        #formulario_actualizar>label,
        #contenedor_seleccion_docente>label {
            font-size: 13px;
        }
    }
</style>

<section id="modulo_modificar_notas_academicas">
    <div class="contenedor_modificar_notas_academicas">
        <h2>Modificar Notas Académicas</h2>

        <div class="modificar_notas_academicas">
            <form method="post" id="formulario_actualizar">
                {% csrf_token %}
                <label for="perfiles_asignados">Perfil Asignado:</label>
                <select name="perfiles_asignados" id="perfiles_asignados" style="display: none;"></select>

                <input type="text" name="perfiles_asignados" id="perfil_asignado" readonly style="display: none;">

                <label for="nucleo_asignado">Núcleo Asignado:</label>
                <select name="nucleo_asignado" id="nucleo_asignado"></select>

                <label for="pnf_asignado">P.N.F Asignado:</label>
                <select name="pnf_asignado" id="pnf_asignado"></select>

                <div id="contenedor_seleccion_docente" style="display: none;">
                    <label for="seleccion_docente">Docente:</label>
                    <select name="seleccion_docente" id="seleccion_docente">
                        <option value="" selected>Selecciona un Docente</option>
                    </select>
                </div>

                <label for="trayecto_academico">Trayecto Académico:</label>
                <select name="trayecto_academico" id="trayecto_academico">
                    <option value='' selected>Debe seleccionar el Trayecto Académico</option>
                </select>

                <label for="materia_asignada">Materia(s) Asignada(s):</label>
                <select name="materia_asignada" id="materia_asignada"></select>

                <label for="periodo_academico">Periodo Académico:</label>
                <input type="text" name="periodo_academico" id="periodo_academico" readonly>

                <div class="contenedor_boton_notas">
                    <input type="submit" value="Registrar" id="btn_registrar_notas">
                </div>

                <div id="contenedor_notas_academicas"></div>
            </form>
        </div>
    </div>
</section>

<script src="{% static 'Funciones_Asincronas/Docente/Notas_Academicas/modificar_notas_academicas.js' %}"></script>

{% endblock %}
